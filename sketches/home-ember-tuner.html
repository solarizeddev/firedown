<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firedown — ember-while-downloading tuner</title>
<style>
  :root{--surface:#121212;--container:#1b1b1b;--on:#e6e1e5;--variant:#a9a3ad;
    --brand:#ff6a1a;--brand-soft:#ff9a54;--outline:#262626}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Roboto,"Segoe UI",sans-serif;
    background:#0a0a0a;color:var(--on);padding:22px 16px 60px;
    display:flex;flex-direction:column;align-items:center;gap:18px}
  h1{font-size:16px;font-weight:600;margin:0}
  .sub{color:#7d7d7d;font-size:12px;margin:-10px 0 0;text-align:center;max-width:420px;line-height:1.5}

  /* variant tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .tabs button{background:var(--container);color:var(--on);border:1px solid var(--outline);
    border-radius:16px;padding:7px 14px;font-size:12px;cursor:pointer}
  .tabs button.active{border-color:var(--brand);color:var(--brand)}

  /* phone */
  .phone{width:280px;height:520px;border-radius:32px;background:var(--surface);
    border:1px solid #2b2b2b;overflow:hidden;display:flex;flex-direction:column;position:relative}
  .toolbar{height:46px;display:flex;align-items:center;gap:8px;padding:0 13px;color:var(--variant)}
  .urlbar{flex:1;height:33px;border-radius:16px;background:var(--container);
    display:flex;align-items:center;padding:0 13px;font-size:11px;color:var(--variant)}
  .home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}

  .flamewrap{position:relative;width:90px;height:90px;display:grid;place-items:center}
  .flame{font-size:46px;position:relative;z-index:3;line-height:1}
  .wordmark{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
  .stat{font-size:11px;color:var(--variant)}.stat b{font-weight:400}

  /* glow layer (breath) */
  .glow{position:absolute;inset:-10px;border-radius:50%;z-index:1;opacity:0;
    background:radial-gradient(circle,rgba(255,106,26,.6),rgba(255,106,26,0) 68%)}
  .breathing .glow{animation:breathe var(--speed,2.6s) ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:calc(var(--intensity,.4)*.5);transform:scale(.92)}
    50%{opacity:var(--intensity,.4);transform:scale(1.1)}}
  .flame.lit{filter:drop-shadow(0 0 calc(var(--intensity,.4)*14px) rgba(255,150,84,.75))}

  /* rising-ember particles */
  .field{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:visible}
  .spark{position:absolute;bottom:38px;width:4px;height:4px;border-radius:50%;
    background:radial-gradient(circle,var(--brand-soft),rgba(255,106,26,.1));
    will-change:transform,opacity}
  @keyframes rise{
    0%{opacity:0;transform:translate(0,0) scale(.6)}
    15%{opacity:.9}
    100%{opacity:0;transform:translate(var(--dx,0),var(--dy,-70px)) scale(.3)}}

  /* controls */
  .controls{width:280px;background:var(--container);border:1px solid var(--outline);
    border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--variant)}
  .row input[type=range]{accent-color:var(--brand);flex:1}
  .row .val{width:38px;text-align:right;color:var(--on);font-variant-numeric:tabular-nums}
  .toggle{display:flex;gap:8px;justify-content:center}
  .toggle button{flex:1;background:#0e0e0e;color:var(--on);border:1px solid var(--outline);
    border-radius:12px;padding:8px;font-size:12px;cursor:pointer}
  .toggle button.active{border-color:var(--brand);color:var(--brand)}
  .note{font-size:11px;color:#7d7d7d;text-align:center;max-width:300px;line-height:1.5}
</style>
</head>
<body>

  <h1>Ember while downloading</h1>
  <p class="sub">The flame as the live status light. Four ember styles — tune intensity & speed
     live, and (style 4) watch it react to download progress.</p>

  <div class="tabs">
    <button data-v="breath" class="active">1 · Soft breath</button>
    <button data-v="warm">2 · Warm breath + lit flame</button>
    <button data-v="sparks">3 · Rising embers</button>
    <button data-v="linked">4 · Progress-linked</button>
  </div>

  <div class="phone" id="phone">
    <div class="toolbar"><span>‹</span><span>›</span><div class="urlbar">Search or enter address</div><span>⋮</span></div>
    <div class="home">
      <div class="flamewrap" id="fw">
        <div class="glow" id="glow"></div>
        <div class="field" id="field"></div>
        <div class="flame" id="flame">🔥</div>
      </div>
      <div class="wordmark">Firedown</div>
      <div class="stat">10.5K <b>blocked ·</b> 9.5 GB <b>saved</b></div>
    </div>
  </div>

  <div class="controls">
    <div class="toggle">
      <button id="dlOn" class="active">Downloading</button>
      <button id="dlOff">Idle</button>
    </div>
    <div class="row"><span>Intensity</span><input id="intensity" type="range" min="10" max="100" value="40"><span class="val" id="iVal">0.40</span></div>
    <div class="row"><span>Breath speed</span><input id="speed" type="range" min="12" max="46" value="28"><span class="val" id="sVal">2.8s</span></div>
    <div class="row"><span>Progress</span><input id="prog" type="range" min="0" max="100" value="35"><span class="val" id="pVal">35%</span></div>
  </div>
  <p class="note" id="note"></p>

<script>
  const phone=document.getElementById('phone'), flame=document.getElementById('flame'),
        fw=document.getElementById('fw'), field=document.getElementById('field'),
        glow=document.getElementById('glow');
  const iEl=document.getElementById('intensity'), sEl=document.getElementById('speed'), pEl=document.getElementById('prog');
  const iVal=document.getElementById('iVal'), sVal=document.getElementById('sVal'), pVal=document.getElementById('pVal');
  const note=document.getElementById('note');

  let variant='breath', downloading=true, spawnTimer=null;
  const notes={
    breath:'Candle register — just a soft radial breath, no flame glow, no particles. The most restrained. This is roughly where I’d ship the default.',
    warm:'Adds a drop-shadow so the flame itself glows, plus a stronger breath. Reads warmer/more alive — risk of edging toward "notification LED" at high intensity.',
    sparks:'Literal embers: small sparks drift up from the flame. Most evocative of the name, most "premium" — but the busiest. Keep density low.',
    linked:'The animation carries data: breath quickens and sparks thicken as progress climbs, so the flame visibly "finishes". Subtle telemetry with zero text.'
  };

  function applyStatic(){
    const intensity=iEl.value/100;
    fw.style.setProperty('--intensity',intensity);
    iVal.textContent=intensity.toFixed(2);
    // breath speed (slider is tenths of a second)
    const base=(sEl.value/10);
    sVal.textContent=base.toFixed(1)+'s';
    pVal.textContent=pEl.value+'%';
  }

  function effectiveSpeed(){
    const base=sEl.value/10;
    if(variant==='linked'){ const p=pEl.value/100; return (base*(1-0.55*p)).toFixed(2)+'s'; }
    return base.toFixed(1)+'s';
  }

  function render(){
    applyStatic();
    phone.classList.remove('breathing');
    flame.classList.remove('lit');
    clearInterval(spawnTimer); spawnTimer=null;
    field.innerHTML='';
    note.textContent=notes[variant];

    if(!downloading) return;  // idle = nothing, home stays the plain wordmark

    // breath layer for all variants
    fw.style.setProperty('--speed', effectiveSpeed());
    phone.classList.add('breathing');
    if(variant==='warm'||variant==='linked') flame.classList.add('lit');
    if(variant==='warm') glow.style.opacity=''; // handled by animation

    // particles for sparks + linked
    if(variant==='sparks'||variant==='linked'){
      const spawn=()=>{
        const p=pEl.value/100;
        const count = variant==='linked' ? 1+Math.round(p*2) : 1;   // linked thickens with progress
        for(let k=0;k<count;k++) makeSpark();
      };
      const interval = variant==='linked' ? (260-120*(pEl.value/100)) : 240;
      spawnTimer=setInterval(spawn, interval);
    }
  }

  function makeSpark(){
    const s=document.createElement('div'); s.className='spark';
    const x=(Math.random()*46-23);            // start spread around flame
    const dx=(Math.random()*28-14)+'px';
    const dy=(-60-Math.random()*40)+'px';
    const dur=(1.3+Math.random()*0.9);
    const intensity=iEl.value/100;
    s.style.left=`calc(50% + ${x}px)`;
    s.style.setProperty('--dx',dx); s.style.setProperty('--dy',dy);
    s.style.opacity=0.5+intensity*0.5;
    s.style.animation=`rise ${dur}s ease-out forwards`;
    s.addEventListener('animationend',()=>s.remove());
    field.appendChild(s);
  }

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    variant=b.dataset.v;
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));
    render();
  });
  document.getElementById('dlOn').onclick=()=>{downloading=true;
    document.getElementById('dlOn').classList.add('active');document.getElementById('dlOff').classList.remove('active');render();};
  document.getElementById('dlOff').onclick=()=>{downloading=false;
    document.getElementById('dlOff').classList.add('active');document.getElementById('dlOn').classList.remove('active');render();};
  [iEl,sEl,pEl].forEach(el=>el.oninput=render);

  render();
</script>
</body>
</html>
