# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# R8 ProGuard-COMPATIBILITY mode — load-bearing for legible crash traces.
# Since AGP 8.12 (this project ships 9.3.1 / R8 9.3.16), R8 FULL mode replaces
# every class's SourceFile attribute with the synthetic r8-map-id-<hash> and
# compresses line numbers whenever obfuscation or optimization is on,
# REGARDLESS of `-keepattributes SourceFile,LineNumberTable` — the keepattributes
# rule is honored only in compatibility mode. Verified against the shipped
# v1.1.91 APK: its classes.dex contains the r8-map-id marker and zero .java
# source-file strings even though proguard-rules.pro carried the keepattributes
# line at the build commit. With full mode, every field crash report is
# undecodable without the build machine's mapping.txt (which the v1.1.91
# release did not archive) — so compat mode, whose cost is only milder R8
# optimization of an 8.7 MB dex inside a 204 MB APK, is the right trade for an
# app that COLLECTS crash reports. See app/proguard-rules.pro and CLAUDE.md
# "Crash reporting". If this line is ever removed, traces silently regress to
# r8-map-id frames — re-verify with:
#   strings app/build/outputs/apk/release/*.apk-extracted classes.dex | grep BrowserFragment.java
android.enableR8.fullMode=false
android.builtInKotlin=false
android.newDsl=false

# a versionCode that already uploaded one (sends `?force=1`; the collector
# would otherwise answer 409 `mapping-exists` and fail the build). The newest
# build of an unshipped version is the one its reports will decode with. Once a
# build has SHIPPED, bump versionCode instead of rebuilding under it — see
# uploadReleaseMapping in app/build.gradle.
firedown.mappingForce=true

# --- Prebuilt native dependencies (fetched, not built here) -------------------
# The FFmpeg .so set and the patched GeckoView AAR are compiled in their own
# repos (firedown-ffmpeg, firedown-geckoview — hours each, Docker for Gecko) and
# published as GitHub Release assets of those repos. These two lines pin which
# build this app links; settings.gradle runs scripts/fetch-prebuilts.sh on every
# sync, which downloads whatever is missing (gh auth login once per machine) and
# is silent once it is in place. A machine that builds a library itself lands
# it in the same place the fetch would (external/ffmpeg, ~/.m2) and is never
# re-fetched. Bumping = publish a new release from the build box, change the
# line, commit. See docs/NEW-MACHINE.md.
#
# firedown-ffmpeg release tag (v<ffmpeg-version>-<n>): scripts/publish-release.sh there.
firedown.ffmpegRelease=v9.0.2-1
# GeckoView Maven version = firedown-geckoview release tag `geckoview-<this>` =
# config/build.env GECKOVIEW_VERSION there. app/build.gradle reads it from here.
firedown.geckoviewVersion=157.0.20260924084938
