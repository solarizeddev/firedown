<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}html,body{height:100%}
body{background:#391D5B;color:#E4E2E5;font-family:'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column}
.omni{margin:14px 18px;height:44px;border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 18px;font-size:14px;background:#4A3A5E;color:#b9aecb}
.duck{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb37a,#f0716c 70%)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.illus{width:168px;height:auto;display:block}
.wm{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:-8px;color:#E4E2E5}
.disc{position:absolute;left:24px;right:24px;bottom:14px;font-size:11px;line-height:1.4;text-align:center;color:#9C8FB4}
.nav{display:flex;justify-content:space-around;align-items:center;padding:14px 0;border-top:1px solid rgba(255,255,255,.08)}
.ni svg{width:21px;height:21px;color:#d8cfe6;opacity:.85}
.tabsq{width:19px;height:19px;border:1.7px solid #d8cfe6;border-radius:5px;font-size:10px;color:#d8cfe6;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="omni"><span class="duck"></span>Search or Type URL</div>
<div class="stage">
  <img class="illus" src="../app/src/main/res/drawable-nodpi/ill_privacy_purple.png">
  <div class="wm">Private Browsing</div>
  <div class="disc">Private Browsing doesn't hide your activity from your network, employer, or the sites you visit.</div>
</div>
<div class="nav">
  <div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
  <div class="tabsq">1</div>
  <div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></div>
  <div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
  <div class="ni"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></div>
</div>
</body></html>
