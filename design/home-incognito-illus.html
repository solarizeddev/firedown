<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{background:#E9E6E4;font-family:'Segoe UI',Roboto,sans-serif;padding:30px}
.phone{width:280px;height:580px;border-radius:32px;padding:8px;background:#221140;border:1px solid #2a1b45;box-shadow:0 16px 44px rgba(40,20,70,.42),0 0 0 6px #1c1133}
.screen{width:100%;height:100%;border-radius:25px;overflow:hidden;display:flex;flex-direction:column;background:#391D5B;color:#E4E2E5}
.status{display:flex;justify-content:space-between;padding:9px 15px 3px;font-size:11px;font-weight:600;opacity:.85}
.omni{margin:6px 11px;height:40px;border-radius:20px;display:flex;align-items:center;gap:9px;padding:0 15px;font-size:12.5px;background:#4A3A5E;color:#b9aecb}
.duck{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb37a,#f0716c 70%)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0 24px}
.illus{width:200px;height:auto;display:block}
.wm{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:12px;color:#E4E2E5}
.disc{position:absolute;left:20px;right:20px;bottom:16px;font-size:10px;line-height:1.45;text-align:center;color:#9C8FB4}
.nav{display:flex;justify-content:space-around;align-items:center;padding:12px 0 14px;border-top:1px solid rgba(255,255,255,.08)}
.ni{color:#d8cfe6;opacity:.85}.ni svg{width:20px;height:20px}
.tabsq{width:18px;height:18px;border:1.7px solid currentColor;border-radius:5px;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="phone"><div class="screen">
  <div class="status"><span>16:51</span><span>&#128246; 98%</span></div>
  <div class="omni"><span class="duck"></span>Search or type URL</div>
  <div class="stage">
    <img class="illus" src="../app/src/main/res/drawable-nodpi/ill_privacy_purple.png">
    <div class="wm">Private Browsing</div>
    <div class="disc">Private Browsing doesn't hide your activity from your network, employer, or the sites you visit.</div>
  </div>
  <div class="nav">
    <div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
    <div class="ni"><div class="tabsq">2</div></div>
    <div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></div>
    <div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg></div>
    <div class="ni"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></div>
  </div>
</div></div>
</body></html>
