// ── Release bookkeeping: version bump + status.json ─────────────────────────
// Applied from app/build.gradle. Two tasks, both in the `firedown` group:
//
//   ./gradlew bumpVersion
//       versionCode + 1 in app/build.gradle, and the versionName DERIVED from
//       it: the name IS the code written as major.minor.patch — 1202 ↔
//       "1.2.2", 1210 ↔ "1.2.10", 1300 ↔ "1.3.0" — so the About screen, the
//       F-Droid filename, status.json's release tag and the mapping upload all
//       say one number. Then it opens a "## [1.2.3] - <today>" entry at the
//       top of CHANGELOG.md. The hundredth patch rolls into the next minor by
//       construction (1.2.99 → 1.3.0); to start a minor or major earlier pass
//       -Pfiredown.versionName=1.3.0 and the CODE follows the name (→ 1300).
//       A build.gradle whose code and name
//       disagree FAILS the task instead of being silently "fixed". Run it ON
//       ITS OWN: the file is rewritten after Gradle has already read the old
//       values, so a build in the same invocation would still produce the old
//       version. Pinned by scripts/release-harness/run.sh, which drives this
//       task under a scratch Gradle project.
//
//   releaseStatus   (runs by itself after every assembleRelease)
//       Rewrites status.json — the file the in-app update check reads — for
//       the APK just built: versionCode, "Firedown <versionName>", the GitHub
//       release URL, the F-Droid repo fallback, the APK's sha256, and the
//       "What's new" text taken from the CHANGELOG.md entry for this version.
//       It replaces scripts/update-status-changelog.mjs, which only did the
//       changelog half and left everything else to be edited by hand.
//       Writing the file publishes nothing: status.json reaches users only
//       when it is committed and pushed, which stays a deliberate step after
//       the APK is up on GitHub and the F-Droid repo. A rebuild under the same
//       version simply rewrites it with the newer build's hash.
//       -Pfiredown.releaseStatus=false skips it; `./gradlew releaseStatus` on
//       its own re-runs it against the newest signed APK (e.g. after filling
//       in a changelog entry the release build refused).
//
// Which APK: release builds are signed through Android Studio's "Generate
// Signed App Bundle or APK" wizard, which writes app-release.apk + its
// output-metadata.json into app/release/ (there is no signingConfig in
// build.gradle, so a command-line build is UNSIGNED). The task looks in the
// wizard's location (and the standard outputs dir), keeps only an APK whose
// output-metadata.json says THIS versionCode and that is not *-unsigned, and
// takes the newest. Hashing anything else would publish a checksum no
// downloadable file matches, so finding none fails the task.

import groovy.json.JsonGenerator
import groovy.json.JsonSlurper

import java.security.MessageDigest
import java.time.LocalDate
import java.util.regex.Matcher
import java.util.regex.Pattern

def releaseGradleFile = file('build.gradle')
def releaseChangelogFile = rootProject.file('CHANGELOG.md')
def releaseStatusFile = rootProject.file('status.json')

// One parse of the CHANGELOG, shared by both tasks: the first
// "## [version] - date" block's version and its bullet lines.
def readLatestChangelog = { File changelog ->
    String version = null
    List<String> bullets = []
    boolean inBlock = false
    for (String line : changelog.readLines('UTF-8')) {
        Matcher header = line =~ /^##\s*\[([^\]]+)\]/
        if (header.find()) {
            if (inBlock) {
                break
            }
            version = header.group(1).trim()
            inBlock = true
            continue
        }
        if (inBlock) {
            Matcher bullet = line =~ /^\s*[-*]\s+(.*)$/
            if (bullet.find() && !bullet.group(1).trim().isEmpty()) {
                bullets.add(bullet.group(1).trim())
            }
        }
    }
    return [version: version, bullets: bullets]
}

// The versionName IS the versionCode, written out: code = major × 1000 +
// minor × 100 + patch (1202 ↔ "1.2.2", 1210 ↔ "1.2.10"). One number
// everywhere a version is shown or keyed, at the cost of a one-digit minor
// and a hundred patches per minor — both far beyond the release cadence.
// bumpVersion and releaseStatus both refuse a build.gradle whose two values
// disagree, so the scheme can't drift by hand. Android upgrades on the code
// alone; the name is display, plus the GitHub release tag.
// History: through 1.2.01 the patch was zero-padded to two digits ("1.2.01")
// so the name read as the code digit for digit. It looked like a typo next to
// every other app's version, so from 1202 the patch is a plain number; the
// padded form of a code is still accepted as the CURRENT name, which is what
// lets the first bump leave "1.2.01" behind. Before the derivation existed,
// bumpVersion added one to the patch as an integer, which is how the name and
// the code came apart.
def versionNameForCode = { int code ->
    return String.format('%d.%d.%d', code.intdiv(1000), code.intdiv(100) % 10, code % 100)
}
// The inverse; null when the name is not in the scheme (a two-digit minor, a
// three-digit patch, extra parts). Lenient about a zero-padded patch, for the
// current name only: an explicit -Pfiredown.versionName must be canonical.
Pattern versionNamePattern = Pattern.compile('^(\\d+)\\.(\\d)\\.(\\d{1,2})$')
def versionCodeForName = { String name ->
    Matcher m = versionNamePattern.matcher(name)
    if (!m.find()) {
        return null
    }
    return m.group(1).toInteger() * 1000 + m.group(2).toInteger() * 100 + m.group(3).toInteger()
}

tasks.register('bumpVersion') {
    description = 'Bumps versionCode, derives versionName from it (1202 → "1.2.2"), and opens a CHANGELOG.md entry for the new version'
    group = 'firedown'
    def explicitName = project.findProperty('firedown.versionName')?.toString()
    doLast {
        String src = releaseGradleFile.getText('UTF-8')
        Pattern codePattern = Pattern.compile('(?m)^(\\s*versionCode\\s+)(\\d+)(\\s*)$')
        Pattern namePattern = Pattern.compile('(?m)^(\\s*versionName\\s+")(\\d+)\\.(\\d+)\\.(\\d+)("\\s*)$')
        Matcher code = codePattern.matcher(src)
        Matcher name = namePattern.matcher(src)
        if (!code.find() || !name.find()) {
            throw new GradleException("bumpVersion: could not find `versionCode <n>` and `versionName \"x.y.z\"` in ${releaseGradleFile}")
        }
        int oldCode = code.group(2).toInteger()
        String oldName = "${name.group(2)}.${name.group(3)}.${name.group(4)}"
        String oldExpected = versionNameForCode(oldCode)
        if (versionCodeForName(oldName) != oldCode) {
            throw new GradleException("bumpVersion: versionCode ${oldCode} and versionName \"${oldName}\" disagree — " +
                    "the name is the code written as major.minor.patch, so ${oldCode} is \"${oldExpected}\". " +
                    "Fix ${releaseGradleFile} by hand first.")
        }
        int newCode
        String newName
        if (explicitName) {
            Integer named = versionCodeForName(explicitName)
            if (named == null || explicitName != versionNameForCode(named)) {
                throw new GradleException("bumpVersion: -Pfiredown.versionName must be major.minor.patch with a one-digit minor " +
                        "and a patch from 0 to 99 without a leading zero (1.3.0), got '${explicitName}'")
            }
            if (named <= oldCode) {
                throw new GradleException("bumpVersion: -Pfiredown.versionName=${explicitName} is versionCode ${named}, " +
                        "not above the current ${oldCode} (\"${oldName}\")")
            }
            newCode = named
            newName = explicitName
        } else {
            newCode = oldCode + 1
            newName = versionNameForCode(newCode)
        }

        // Replace by the matched spans only, so nothing else in the file moves.
        String out = src.substring(0, code.start(2)) + newCode + src.substring(code.end(2))
        Matcher name2 = namePattern.matcher(out)
        name2.find()
        out = out.substring(0, name2.start(2)) + newName + out.substring(name2.end(4))
        releaseGradleFile.write(out, 'UTF-8')

        String changelog = releaseChangelogFile.getText('UTF-8')
        def latest = readLatestChangelog(releaseChangelogFile)
        String opened = 'already present'
        if (latest.version != newName) {
            String entry = "## [${newName}] - ${LocalDate.now()}\n\n"
            int at = changelog.indexOf('## [')
            changelog = at < 0 ? entry + changelog : changelog.substring(0, at) + entry + changelog.substring(at)
            releaseChangelogFile.write(changelog, 'UTF-8')
            opened = 'opened — add its bullets before building the release'
        }
        logger.lifecycle("Version ${oldName} (${oldCode}) → ${newName} (${newCode}). CHANGELOG.md entry [${newName}]: ${opened}.")
    }
}


// ── Update files: the APK compressed, patches from the last releases ──────────
// releaseStatus also writes, into app/build/outputs/update/v<versionName>/,
// everything a release uploads, each file checked before it is listed:
//
//   app-release.apk            the signed APK (GitHub's asset name, unchanged)
//   firedown-<code>.apk.xz     the same APK compressed; the tool unpacks it
//                              again and compares before keeping it
//   patch-<from>-<code>.fdpatch  one per release in release-history.json
//                              below this one whose app can apply patches
//                              (1.2.6 on), at most 3, newest first; each
//                              is applied to its old APK with the app's own
//                              code (UpdatePatch) and must rebuild the new APK
//                              byte for byte, or the build fails
//   SHA256SUMS                 sha256sum format, for anyone checking by hand
//
// The old APKs are downloaded from the URLs release-history.json records and
// must hash to what it records; they are cached in the Gradle user home, so a
// release downloads only the one it has not seen. An old release that can't
// be fetched or doesn't match gets no patch (a warning, not a failure): its
// users download the .xz instead. status.json lists the patches and the .xz
// with their URLs (the GitHub release, then -Pfiredown.updateMirror, by
// default https://www.firedown.app/updates), sha256 and size; an older app
// ignores both blocks. release-history.json gains this release.
//
// The patches are made by app/src/updatetool (bsdiff 4.3, ported), compiled
// here with UpdatePatch.java — the file the app ships — and run in their own
// JVMs: a diff of two 200 MB APKs needs ~2.8 GB of heap and 3–5 minutes.
// -Pfiredown.patchJobs=N runs N at once (default: what the machine's memory
// allows, at most 3). -Pfiredown.updateDeltas=false skips the .xz and the
// patches (status.json then lists neither).
//
//   ./gradlew uploadUpdateRelease
//       Uploads that folder to the GitHub release v<versionName> with `gh`
//       (creating it as a DRAFT with the changelog as notes when it doesn't
//       exist; publishing stays a deliberate step on GitHub), and prints what
//       to copy to the mirror. Same rule as before: commit status.json and
//       release-history.json only once the files are up.
//
//   scripts/publish-release.sh
//       The whole release after the build, in that order: this upload and
//       the draft published, the F-Droid repo (its publish.sh), the .xz and
//       patches to the mirror (checked on the server), then status.json to
//       firedown's main and the website. Checks every URL first; resumable.

def releaseHistoryFile = rootProject.file('release-history.json')
def maxPatches = 3
// The first versionCode whose app reads status.json's `patches` (1.2.6). A
// patch from an older release is uploaded and listed for nobody: those apps
// ignore the block and download the APK. -Pfiredown.patchMinFrom overrides it
// (the update harness builds patches between test APKs numbered lower).
def defaultPatchMinFrom = 1206
def maxHistory = 10
def githubReleaseBase = 'https://github.com/solarizeddev/firedown/releases/download'

// Deletes a file or folder tree. Not project.delete: a task action must not
// reach Task.project (deprecated, an error in Gradle 10).
def deleteTree = { File f ->
    if (!f.exists()) {
        return
    }
    def stream = java.nio.file.Files.walk(f.toPath())
    try {
        stream.sorted(Comparator.reverseOrder()).forEach { java.nio.file.Files.delete(it) }
    } finally {
        stream.close()
    }
}

def sha256Of = { File f ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    f.withInputStream { input ->
        byte[] buffer = new byte[1 << 16]
        int read
        while ((read = input.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().encodeHex().toString()
}

def readReleaseHistory = { File f ->
    if (!f.isFile()) {
        return []
    }
    def parsed = new JsonSlurper().parse(f, 'UTF-8')
    if (!(parsed instanceof List)) {
        throw new GradleException("${f} must be a JSON array of releases")
    }
    return parsed.collect { new LinkedHashMap(it as Map) }
}

// The old APK a patch starts from, downloaded once into the Gradle user home
// and named by its hash. Null (with a warning) when it can't be had.
def fetchReleaseApk = { Map entry, File cacheDir ->
    String sha = entry.sha256?.toString()?.toLowerCase()
    if (!(sha ==~ /[0-9a-f]{64}/) || !entry.apkUrl) {
        logger.warn("release-history.json entry ${entry.versionCode} has no usable sha256/apkUrl; no patch from it")
        return null
    }
    cacheDir.mkdirs()
    File cached = new File(cacheDir, "${sha}.apk")
    if (cached.isFile() && sha256Of(cached) == sha) {
        return cached
    }
    File part = new File(cacheDir, "${sha}.apk.part")
    try {
        logger.lifecycle("Downloading ${entry.versionName} (${entry.versionCode}) from ${entry.apkUrl}")
        URLConnection conn = URI.create(entry.apkUrl.toString()).toURL().openConnection()
        conn.connectTimeout = 30000
        conn.readTimeout = 60000
        conn.inputStream.withStream { input -> part.withOutputStream { out -> out << input } }
        String got = sha256Of(part)
        if (got != sha) {
            logger.warn("${entry.apkUrl} hashes to ${got}, release-history.json says ${sha}; no patch from ${entry.versionCode}")
            part.delete()
            return null
        }
        cached.delete()
        if (!part.renameTo(cached)) {
            throw new IOException("could not rename ${part} to ${cached}")
        }
        return cached
    } catch (Exception e) {
        part.delete()
        logger.warn("Could not download ${entry.apkUrl} (${e}); no patch from ${entry.versionCode}")
        return null
    }
}

// Compiles UpdatePatch.java (as the app ships it) with the generator into a
// throwaway class folder. In-process when the JVM has a compiler, else javac.
def compileUpdateTool = { File xzJar, File outDir ->
    deleteTree(outDir)
    outDir.mkdirs()
    List<File> sources = [file('src/main/java/com/solarized/firedown/update/UpdatePatch.java')]
    sources.addAll(fileTree('src/updatetool/java').matching { include '**/*.java' }.files.sort())
    List<String> args = ['-d', outDir.path, '-classpath', xzJar.path, '--release', '17', '-nowarn',
                         '-encoding', 'UTF-8'] + sources*.path
    def compiler = javax.tools.ToolProvider.getSystemJavaCompiler()
    int rc
    String output
    if (compiler != null) {
        def messages = new ByteArrayOutputStream()
        rc = compiler.run(null, messages, messages, args.collect { it.toString() } as String[])
        output = messages.toString('UTF-8')
    } else {
        String exe = System.getProperty('os.name').toLowerCase().contains('windows') ? 'javac.exe' : 'javac'
        def proc = new ProcessBuilder(([new File(System.getProperty('java.home'), "bin/${exe}").path] + args).collect { it.toString() })
                .redirectErrorStream(true).start()
        output = proc.inputStream.getText('UTF-8')
        rc = proc.waitFor()
    }
    if (rc != 0) {
        throw new GradleException("Could not compile the update tool (app/src/updatetool + UpdatePatch.java):\n${output}")
    }
}

// Starts the tool in its own JVM; its output goes to `log`.
def startUpdateTool = { File classes, File xzJar, heapMb, List<String> toolArgs, File log ->
    String exe = System.getProperty('os.name').toLowerCase().contains('windows') ? 'java.exe' : 'java'
    List<String> command = [new File(System.getProperty('java.home'), "bin/${exe}").path, "-Xmx${heapMb}m",
                            '-cp', classes.path + File.pathSeparator + xzJar.path,
                            'com.solarized.firedown.update.UpdateTool'] + toolArgs
    return new ProcessBuilder(command.collect { it.toString() }).redirectErrorStream(true).redirectOutput(log).start()
}

def awaitUpdateTool = { Process proc, File log, String what ->
    int rc = proc.waitFor()
    if (rc != 0) {
        String tail = log.isFile() ? log.readLines('UTF-8').takeRight(20).join('\n') : ''
        throw new GradleException("${what} failed (exit ${rc}):\n${tail}")
    }
}

tasks.register('releaseStatus') {
    description = 'Writes status.json, release-history.json and the update files (APK, .xz, patches, sha256) for the release APK just built'
    group = 'firedown'
    def versionName = android.defaultConfig.versionName
    def versionCode = android.defaultConfig.versionCode
    def enabled = (project.findProperty('firedown.releaseStatus') ?: 'true').toString() != 'false'
    def deltas = (project.findProperty('firedown.updateDeltas') ?: 'true').toString() != 'false'
    def mirror = (project.findProperty('firedown.updateMirror') ?: 'https://www.firedown.app/updates').toString().replaceAll('/+$', '')
    def patchJobsProp = project.findProperty('firedown.patchJobs')?.toString()
    def patchMinFrom = (project.findProperty('firedown.patchMinFrom') ?: defaultPatchMinFrom).toString() as int
    def xzTool = project.configurations.detachedConfiguration(
            project.dependencies.create("org.tukaani:xz:${project.property('firedown.xzVersion')}"))
    def updateDir = layout.buildDirectory.dir("outputs/update/v${versionName}").get().asFile
    def toolDir = layout.buildDirectory.dir('update-tool').get().asFile
    def apkCache = new File(project.gradle.gradleUserHomeDir, 'caches/firedown-release-apks')
    // A diagnostic APK (-Pfiredown.diagnostic=true, or the older
    // -Pfiredown.geckoNetLog=true) logs every URL and is never published (see
    // app/build.gradle), so it never gets a status.json either.
    def diagnosticBuild = ['firedown.diagnostic', 'firedown.geckoNetLog'].any {
        (project.findProperty(it) ?: 'false').toString() == 'true'
    }
    def apkDirs = [
            project.findProperty('android.injected.apk.location')?.toString(),
            file('release').path,
            layout.buildDirectory.dir('outputs/apk/release').get().asFile.path,
    ].findAll { it }.collect { new File(it) }.unique()
    // As a finalizer of assembleRelease this runs even when the build FAILED,
    // and a failed build leaves the previous APK on disk; only proceed when
    // packaging ran cleanly in this build. Run on its own, there is no
    // packaging task in the graph and it simply proceeds.
    onlyIf {
        def pkg = tasks.findByName('packageRelease')
        boolean packagingOk = pkg == null || !pkg.state.executed || pkg.state.failure == null
        enabled && !diagnosticBuild && packagingOk
    }
    doLast {
        String expectedName = versionNameForCode(versionCode as int)
        if (versionName != expectedName) {
            throw new GradleException("releaseStatus: versionCode ${versionCode} and versionName \"${versionName}\" disagree — " +
                    "the name is the code written as major.minor.patch (\"${expectedName}\"); status.json keys the update " +
                    "on the code and the download URL on the name, so they must agree. Fix app/build.gradle " +
                    "(./gradlew bumpVersion keeps them in step).")
        }
        def latest = readLatestChangelog(releaseChangelogFile)
        if (latest.version != versionName) {
            throw new GradleException("releaseStatus: CHANGELOG.md's newest entry is [${latest.version}] but this build is ${versionName}. " +
                    "Add a \"## [${versionName}] - <date>\" entry (./gradlew bumpVersion opens one), then run ./gradlew releaseStatus.")
        }
        if (latest.bullets.isEmpty()) {
            throw new GradleException("releaseStatus: the CHANGELOG.md entry for ${versionName} has no bullet lines — " +
                    "it becomes the update sheet's \"What's new\". Fill it in, then run ./gradlew releaseStatus.")
        }

        File apk = null
        for (File dir : apkDirs) {
            File meta = new File(dir, 'output-metadata.json')
            if (!meta.isFile()) {
                continue
            }
            def parsed = new JsonSlurper().parse(meta, 'UTF-8')
            for (def element : (parsed.elements ?: [])) {
                String outputFile = element.outputFile?.toString()
                if (element.versionCode != versionCode || !outputFile || outputFile.contains('unsigned')) {
                    continue
                }
                File candidate = new File(dir, outputFile)
                if (candidate.isFile() && (apk == null || candidate.lastModified() > apk.lastModified())) {
                    apk = candidate
                }
            }
        }
        if (apk == null) {
            throw new GradleException("releaseStatus: no signed APK for versionCode ${versionCode} in ${apkDirs*.path.join(', ')}. " +
                    "Build it with Build → Generate Signed App Bundle or APK (or skip with -Pfiredown.releaseStatus=false).")
        }
        String sha256 = sha256Of(apk)
        String releaseBase = "${githubReleaseBase}/v${versionName}"
        def urlsFor = { String fileName ->
            List<String> urls = ["${releaseBase}/${fileName}".toString()]
            if (mirror) {
                urls.add("${mirror}/${fileName}".toString())
            }
            return urls
        }

        // The upload folder, rebuilt from scratch so nothing stale is uploaded.
        deleteTree(updateDir)
        updateDir.mkdirs()
        File apkOut = new File(updateDir, 'app-release.apk')
        java.nio.file.Files.copy(apk.toPath(), apkOut.toPath())
        Map<String, String> sums = new LinkedHashMap<>()
        sums[apkOut.name] = sha256

        List history = readReleaseHistory(releaseHistoryFile)
        Map compressedBlock = null
        List patchBlocks = []
        if (deltas) {
            File xzJar = xzTool.singleFile
            File classes = new File(toolDir, 'classes')
            File logs = new File(toolDir, 'logs')
            deleteTree(logs)
            logs.mkdirs()
            compileUpdateTool(xzJar, classes)

            // Patches from the newest older releases, each from an APK that
            // hashes to what release-history.json says was published.
            // Only from releases whose app can apply one (patchMinFrom).
            List sources = history.findAll { (it.versionCode as int) < (versionCode as int)
                                             && (it.versionCode as int) >= patchMinFrom }
                    .sort { -(it.versionCode as int) }
                    .take(maxPatches)
            if (history.any { (it.versionCode as int) < patchMinFrom }) {
                logger.lifecycle("No patches from releases before ${patchMinFrom}: their app reads none")
            }
            List jobs = []
            for (Map entry : sources) {
                File old = fetchReleaseApk(entry, apkCache)
                if (old != null) {
                    jobs.add([entry: entry, old: old,
                              patch: new File(updateDir, "patch-${entry.versionCode}-${versionCode}.fdpatch")])
                }
            }

            // ~10 bytes per old byte (the suffix arrays) + the new file + headroom.
            long maxOld = (jobs.collect { it.old.length() as long }.max() ?: 0L) as long
            long heapMb = (maxOld * 10L + apk.length()).intdiv(1L << 20) + 768L
            int parallel = 1
            if (patchJobsProp) {
                parallel = Math.max(1, patchJobsProp as int)
            } else {
                long totalMb = 0L
                try {
                    def os = java.lang.management.ManagementFactory.getOperatingSystemMXBean()
                    if (os instanceof com.sun.management.OperatingSystemMXBean) {
                        totalMb = ((com.sun.management.OperatingSystemMXBean) os).getTotalMemorySize().intdiv(1L << 20)
                    }
                } catch (Throwable ignored) {
                    totalMb = 0L
                }
                // Leave room for the Gradle daemon (4 GB), what the Android
                // build left resident, the .xz job and the system.
                parallel = (int) Math.max(1L, Math.min((long) maxPatches, (totalMb - 8192L).intdiv(Math.max(1L, heapMb))))
            }

            long started = System.currentTimeMillis()
            File xzOut = new File(updateDir, "firedown-${versionCode}.apk.xz")
            File xzLog = new File(logs, 'xz.log')
            Process xzProc = startUpdateTool(classes, xzJar, 1024L, ['xz', apkOut.path, xzOut.path], xzLog)
            if (!jobs.isEmpty()) {
                logger.lifecycle("Making ${jobs.size()} patch(es), ${parallel} at a time, ${heapMb} MB heap each " +
                        "(a few minutes each): ${jobs.collect { it.entry.versionName }.join(', ')} → ${versionName}")
            }
            List running = []
            try {
                for (List batch : jobs.collate(parallel)) {
                    running = batch.collect { job ->
                        File log = new File(logs, "${job.patch.name}.log")
                        [job: job, log: log,
                         proc: startUpdateTool(classes, xzJar, heapMb, ['diff', job.old.path, apkOut.path, job.patch.path], log)]
                    }
                    running.each { awaitUpdateTool(it.proc, it.log, "Patch ${it.job.entry.versionCode} → ${versionCode}") }
                }
                awaitUpdateTool(xzProc, xzLog, 'Compressing the APK')
            } catch (Throwable t) {
                // Don't leave multi-GB JVMs running behind a failed build.
                running.each { it.proc.destroyForcibly() }
                xzProc.destroyForcibly()
                throw t
            }

            String xzSha = sha256Of(xzOut)
            sums[xzOut.name] = xzSha
            compressedBlock = [format: 'xz', urls: urlsFor(xzOut.name), sha256: xzSha, size: xzOut.length()]
            for (Map job : jobs) {
                String patchSha = sha256Of(job.patch)
                sums[job.patch.name] = patchSha
                patchBlocks.add([fromVersionCode: job.entry.versionCode as int,
                                 fromSha256     : job.entry.sha256.toString().toLowerCase(),
                                 urls           : urlsFor(job.patch.name),
                                 sha256         : patchSha,
                                 size           : job.patch.length()])
            }
            long seconds = (System.currentTimeMillis() - started).intdiv(1000)
            logger.lifecycle("Update files checked in ${seconds} s: APK ${(apk.length() >> 20)} MB, .xz ${(xzOut.length() >> 20)} MB" +
                    patchBlocks.collect { ", patch from ${it.fromVersionCode} ${((it.size as long) >> 20)} MB" }.join(''))
        }
        new File(updateDir, 'SHA256SUMS').write(sums.collect { name, sum -> "${sum}  ${name}\n" }.join(''), 'UTF-8')

        // Keep the existing key order (and any key this task doesn't own).
        Map status = releaseStatusFile.isFile() ? new JsonSlurper().parse(releaseStatusFile, 'UTF-8') as Map : [:]
        Map out = new LinkedHashMap(status)
        out.versionCode = versionCode
        out.updateUrl = "${releaseBase}/app-release.apk".toString()
        out.updateUrlFallbacks = ["https://www.firedown.app/fdroid/repo/com.solarized.firedown_${versionCode}.apk".toString()]
        out.versionName = "Firedown ${versionName}".toString()
        out.sha256 = sha256
        out.changelog = latest.bullets.collect { "• ${it}" }.join('\n')
        // The previous release's blocks describe ITS files: never carry them over.
        out.remove('patches')
        out.remove('compressed')
        if (!patchBlocks.isEmpty()) {
            out.patches = patchBlocks
        }
        if (compressedBlock != null) {
            out.compressed = compressedBlock
        }

        // Same bytes the old node script wrote (JSON.stringify): compact, and
        // non-ASCII left as UTF-8 rather than \u-escaped.
        def json = new JsonGenerator.Options().disableUnicodeEscaping().build()
        releaseStatusFile.write(json.toJson(out) + '\n', 'UTF-8')

        // This release becomes a patch source for the next ones.
        List kept = history.findAll { (it.versionCode as int) != (versionCode as int) }
        kept.add(0, [versionCode: versionCode as int, versionName: versionName.toString(),
                     apkUrl: out.updateUrl, sha256: sha256, size: apk.length()])
        kept = kept.sort { -(it.versionCode as int) }.take(maxHistory)
        releaseHistoryFile.write(groovy.json.JsonOutput.prettyPrint(json.toJson(kept)) + '\n', 'UTF-8')

        logger.lifecycle("status.json → Firedown ${versionName} (${versionCode}), sha256 ${sha256.take(12)}… of ${apk}, " +
                "${latest.bullets.size()} changelog items, ${patchBlocks.size()} patch(es)" +
                (compressedBlock != null ? ', .xz' : '') + ". Upload ${updateDir} (./gradlew uploadUpdateRelease), " +
                "then commit status.json and release-history.json.")
    }
}

tasks.register('uploadUpdateRelease') {
    description = 'Uploads app/build/outputs/update/v<versionName> to the GitHub release (a draft is created if needed)'
    group = 'firedown'
    def versionName = android.defaultConfig.versionName
    def repo = (project.findProperty('firedown.githubRepo') ?: 'solarizeddev/firedown').toString()
    def mirror = (project.findProperty('firedown.updateMirror') ?: 'https://www.firedown.app/updates').toString().replaceAll('/+$', '')
    def updateDir = layout.buildDirectory.dir("outputs/update/v${versionName}").get().asFile
    doLast {
        if (!new File(updateDir, 'SHA256SUMS').isFile()) {
            throw new GradleException("uploadUpdateRelease: ${updateDir} has no SHA256SUMS — build the release first (releaseStatus writes it).")
        }
        List<File> files = updateDir.listFiles().findAll { it.isFile() && !it.name.endsWith('.tmp') && !it.name.endsWith('.check') }.sort { it.name }
        String tag = "v${versionName}"
        def gh = { List<String> command, boolean mustSucceed ->
            def proc = new ProcessBuilder(command.collect { it.toString() }).redirectErrorStream(true).start()
            String output = proc.inputStream.getText('UTF-8')
            int rc = proc.waitFor()
            if (mustSucceed && rc != 0) {
                throw new GradleException("`${command.join(' ')}` failed (exit ${rc}):\n${output}")
            }
            return rc
        }
        if (gh(['gh', 'release', 'view', tag, '--repo', repo], false) != 0) {
            def latest = readLatestChangelog(releaseChangelogFile)
            File notes = new File(temporaryDir, 'notes.md')
            notes.write(latest.version == versionName ? latest.bullets.collect { "- ${it}" }.join('\n') + '\n' : '', 'UTF-8')
            gh(['gh', 'release', 'create', tag, '--repo', repo, '--draft', '--title', "Firedown ${versionName}".toString(),
                 '--notes-file', notes.path], true)
            logger.lifecycle("Created the DRAFT release ${tag}; publish it on GitHub when ready.")
        }
        gh(['gh', 'release', 'upload', tag, '--repo', repo, '--clobber'] + files*.path, true)
        logger.lifecycle("Uploaded to ${repo} ${tag}: ${files*.name.join(', ')}")
        List<File> mirrored = files.findAll { it.name.endsWith('.xz') || it.name.endsWith('.fdpatch') }
        if (mirror && !mirrored.isEmpty()) {
            logger.lifecycle("Also copy ${mirrored*.name.join(', ')} to ${mirror}/ (status.json lists it as the mirror): " +
                    "scripts/publish-release.sh does that and the rest of the release.")
        }
        logger.lifecycle("Then commit status.json and release-history.json.")
    }
}

afterEvaluate {
    tasks.findByName('assembleRelease')?.finalizedBy('releaseStatus')
}
